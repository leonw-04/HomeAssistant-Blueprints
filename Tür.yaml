
blueprint:
  name: Smarte Schlösser - Nacht und Abwesenheit
  description: >
    Verriegelt beliebig viele smarte Schlösser nachts und optional
    bei Abwesenheit aller ausgewählten Personen. Optional können
    Türkontakte überwacht werden. Wenn ein ausgewählter Kontakt
    offen oder nicht verfügbar ist, wird kein Schloss verriegelt.
    Es erfolgt niemals eine automatische Entriegelung.
  domain: automation

  input:
    locks:
      name: Smarte Schlösser
      description: Alle zu verriegelnden Schlösser auswählen
      selector:
        entity:
          filter:
            - domain: lock
          multiple: true

    night_time:
      name: Uhrzeit für Nachtverriegelung
      default: "23:00:00"
      selector:
        time:

    enable_away:
      name: Bei Abwesenheit verriegeln
      description: Diese Funktion ist optional
      default: false
      selector:
        boolean:

    persons:
      name: Personen für die Anwesenheit
      description: Nur erforderlich, wenn Abwesenheit aktiviert ist
      default: []
      selector:
        entity:
          filter:
            - domain: person
          multiple: true

    away_delay:
      name: Abwesenheitsverzögerung
      default: 5
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: Minuten
          mode: slider

    door_contacts:
      name: Türkontakte (optional)
      description: >
        Alle überwachten Türkontakte auswählen. Verriegelt wird nur,
        wenn alle ausgewählten Kontakte sicher geschlossen melden.
        Ohne ausgewählte Kontakte erfolgt keine Türkontaktprüfung.
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: door
          multiple: true

variables:
  lock_entities: !input locks
  person_entities: !input persons
  contact_entities: !input door_contacts
  away_enabled: !input enable_away

trigger_variables:
  tracked_persons: !input persons
  away_enabled_trigger: !input enable_away

triggers:
  - trigger: time
    at: !input night_time
    id: night

  - trigger: template
    id: away
    value_template: >
      {% set people = expand(tracked_persons) %}
      {{ away_enabled_trigger
         and people | length > 0
         and (people
           | selectattr('state', 'in',
             ['home', 'unknown', 'unavailable'])
           | list | length == 0) }}
    for:
      minutes: !input away_delay

conditions:
  - condition: template
    value_template: >
      {{ trigger.id == 'night'
         or (
           away_enabled
           and person_entities | length > 0
           and (
             expand(person_entities)
             | selectattr('state', 'in',
               ['home', 'unknown', 'unavailable'])
             | list | length == 0
           )
         ) }}

actions:
  - alias: Alle ausgewählten Türkontakte sicher prüfen
    choose:
      - conditions:
          - condition: template
            value_template: >
              {{ contact_entities | length == 0
                 or (
                   expand(contact_entities)
                   | selectattr('state', 'eq', 'off')
                   | list | length == contact_entities | length
                 ) }}
        sequence:
          - alias: Alle Schlösser verriegeln
            action: lock.lock
            target:
              entity_id: !input locks
            continue_on_error: true

          - delay: "00:00:10"

          - alias: Prüfen, ob alle Schlösser verriegelt sind
            if:
              - condition: template
                value_template: >
                  {{ expand(lock_entities)
                     | selectattr('state', 'eq', 'locked')
                     | list | length != lock_entities | length }}
            then:
              - action: persistent_notification.create
                data:
                  title: "Sicherheit: Schloss nicht bestätigt"
                  message: >
                    Mindestens eines der ausgewählten Schlösser
                    meldet nach dem Verriegelungsversuch nicht
                    den Status „locked“. Bitte den Status aller
                    Schlösser prüfen.

              - action: notify.notify
                continue_on_error: true
                data:
                  title: "Home Assistant: Schloss prüfen"
                  message: >
                    Mindestens ein Schloss konnte nicht als
                    verriegelt bestätigt werden. Bitte prüfen.

    default:
      - action: persistent_notification.create
        data:
          title: "Sicherheit: Tür nicht geschlossen"
          message: >
            Mindestens ein ausgewählter Türkontakt meldet offen
            oder einen unbekannten Zustand. Es wurden keine
            Schlösser angesteuert. Bitte Türen und Kontakte prüfen.

      - action: notify.notify
        continue_on_error: true
        data:
          title: "Home Assistant: Tür offen"
          message: >
            Mindestens ein überwachter Türkontakt ist offen
            oder nicht verfügbar. Es wurde kein Schloss angesteuert.

mode: single
max_exceeded: silent
