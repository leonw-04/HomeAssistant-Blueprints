blueprint:
  name: "Wetterwarnung: offene / unerreichbare Fenster"
  description: >-
    Prüft einen stündlichen Wetter-Forecast und meldet offene oder nicht verlässlich
    rückmeldende Fenstersensoren. Es gibt zwei Fensterkategorien: kritische Fenster
    (z. B. Dachfenster) und reguläre Fenster. Für jede Kategorie kann unabhängig
    gewählt werden, ob die Warnschwelle über Niederschlagswahrscheinlichkeit (%)
    oder Niederschlagsmenge (z. B. mm pro Forecast-Stunde) bestimmt wird.

    unknown/unavailable werden immer separat als unbekannter Sensorzustand gemeldet.
    Optional kann zusätzlich last_reported als Stale-Heuristik verwendet werden.
    Diese Option nur aktivieren, wenn die verwendete Sensorintegration regelmäßig
    Zustände an Home Assistant meldet.

    Ein konfigurierbarer Cooldown verhindert wiederholte Benachrichtigungen bei
    unverändert bestehender Warnlage. Der Cooldown startet nur, wenn tatsächlich
    mindestens eine Warnung gesendet wurde.

    Wenn nur die kritische Warnschwelle erreicht ist, können offene reguläre Fenster
    in derselben Meldung als Empfehlung zum Schließen erscheinen. Optional kann für
    reguläre Fenster außerdem ein Vorwarnbereich aktiviert werden, der bereits vor
    Erreichen der regulären Warnschwelle eine Empfehlung sendet.

    Die auswählbaren Kontaktsensoren werden auf Binary-Sensoren der Device Classes
    'window' und 'door' begrenzt. Optional kann je Fenstergruppe ein input_boolean-
    Helper den Warnstatus speichern. Dadurch kann nach dem Schließen der zuvor
    beanstandeten Fenster gezielt eine Entwarnung gesendet werden.
  domain: automation
  homeassistant:
    min_version: 2026.9.0

  input:
    weather_settings:
      name: Wetter
      input:
        weather_entity:
          name: Wetter-Entität
          description: Muss einen stündlichen Forecast unterstützen.
          selector:
            entity:
              filter:
                - domain: weather

        weather_conditions:
          name: Relevante Wetterzustände
          description: >-
            Nur Forecast-Einträge mit einem dieser Wetterzustände werden ausgewertet.
            Die Schwellenwerte darunter beziehen sich auf Niederschlagsdaten.
          default:
            - rainy
            - pouring
            - lightning-rainy
            - hail
            - snowy-rainy
          selector:
            select:
              multiple: true
              options:
                - label: Regen
                  value: rainy
                - label: Starkregen
                  value: pouring
                - label: Gewitter mit Regen
                  value: lightning-rainy
                - label: Hagel
                  value: hail
                - label: Schneeregen
                  value: snowy-rainy
                - label: Schnee
                  value: snowy

        forecast_hours:
          name: Vorwarnzeitraum
          description: Wie viele Stunden des Hourly-Forecasts ausgewertet werden.
          default: 3
          selector:
            number:
              min: 1
              max: 12
              step: 1
              unit_of_measurement: h
              mode: slider

    critical_windows_settings:
      name: Kritische Fenster
      input:
        critical_windows:
          name: Kritische Fenster / Dachfenster
          description: Diese Fenster sollen bei relevantem Wetter möglichst immer geschlossen sein.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - window
                    - door

        critical_threshold_type:
          name: Schwellenart
          default: probability
          selector:
            select:
              options:
                - label: Regenwahrscheinlichkeit (%)
                  value: probability
                - label: Niederschlagsmenge
                  value: amount

        critical_probability:
          name: Regenwahrscheinlichkeit
          description: Wird nur verwendet, wenn als Schwellenart Regenwahrscheinlichkeit gewählt ist.
          default: 25
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        critical_amount:
          name: Niederschlagsmenge
          description: >-
            Wird nur verwendet, wenn Niederschlagsmenge gewählt ist. Verglichen wird
            der höchste Wert eines Forecast-Eintrags im Vorwarnzeitraum. Die Einheit
            kommt von der Wetter-Entität (bei metrischer Konfiguration meist mm).
          default: 0.2
          selector:
            number:
              min: 0
              max: 50
              step: 0.1
              mode: box

    regular_windows_settings:
      name: Reguläre Fenster
      input:
        regular_windows:
          name: Reguläre Fenster
          description: Diese Fenster werden typischerweise erst bei stärkerem Regen gemeldet.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - window
                    - door

        regular_threshold_type:
          name: Schwellenart
          default: amount
          selector:
            select:
              options:
                - label: Regenwahrscheinlichkeit (%)
                  value: probability
                - label: Niederschlagsmenge
                  value: amount

        regular_probability:
          name: Regenwahrscheinlichkeit
          description: Wird nur verwendet, wenn als Schwellenart Regenwahrscheinlichkeit gewählt ist.
          default: 60
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        regular_amount:
          name: Niederschlagsmenge
          description: >-
            Wird nur verwendet, wenn Niederschlagsmenge gewählt ist. Verglichen wird
            der höchste Forecast-Wert im Vorwarnzeitraum.
          default: 1.5
          selector:
            number:
              min: 0
              max: 50
              step: 0.1
              mode: box

        recommend_regular_with_critical:
          name: Reguläre Fenster bei kritischer Warnung empfehlen
          description: >-
            Wenn die kritische Schwelle erreicht ist, aber die reguläre Schwelle noch
            nicht, werden offene reguläre Fenster in der kritischen Nachricht als
            Empfehlung zum Schließen aufgeführt.
          default: true
          selector:
            boolean: {}

        regular_prewarning_enabled:
          name: Vorwarnung für reguläre Fenster
          description: >-
            Optional bereits vor Erreichen der regulären Warnschwelle eine reine
            Empfehlung senden. Die Vorwarnung wird nur für tatsächlich offene
            reguläre Fenster erzeugt.
          default: false
          selector:
            boolean: {}

        regular_prewarning_percent:
          name: Vorwarnung ab Anteil der regulären Schwelle
          description: >-
            Beispiel: 80 % bei einer regulären Schwelle von 60 % bedeutet eine
            Empfehlung ab 48 %. Bei Niederschlagsmenge wird entsprechend gerechnet.
          default: 80
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

    sensor_health_settings:
      name: Sensor-Rückmeldung
      input:
        stale_minutes:
          name: Keine Rückmeldung seit ... Minuten
          description: >-
            0 deaktiviert die Prüfung. Wenn größer 0, wird last_reported geprüft.
            Nur verwenden, wenn deine Fensterintegration auch bei unverändertem
            Fensterzustand regelmäßig an Home Assistant berichtet. Sonst entstehen
            Fehlalarme.
          default: 0
          selector:
            number:
              min: 0
              max: 10080
              step: 15
              unit_of_measurement: min
              mode: box

    execution_settings:
      name: Prüfung und Benachrichtigung
      input:
        check_triggers:
          name: Prüf-Trigger
          description: >-
            Standardmäßig wird alle 15 Minuten geprüft. Hier können bei Bedarf weitere
            oder andere Trigger definiert werden.
          default:
            - trigger: time_pattern
              minutes: "/15"
          selector:
            trigger: {}

        critical_actions:
          name: Benachrichtigung für kritische Fenster
          description: >-
            Frei definierbare Actions. In Nachrichtentemplates steht
            {{ critical_message }} zur Verfügung.
          default:
            - action: persistent_notification.create
              data:
                notification_id: weather_window_critical
                title: "⚠️ Kritisches Fenster + Wetter"
                message: "{{ critical_message }}"
          selector:
            action: {}

        regular_actions:
          name: Benachrichtigung für reguläre Fenster
          description: >-
            Frei definierbare Actions. In Nachrichtentemplates steht
            {{ regular_message }} zur Verfügung.
          default:
            - action: persistent_notification.create
              data:
                notification_id: weather_window_regular
                title: "🌧️ Fenster + stärkerer Niederschlag"
                message: "{{ regular_message }}"
          selector:
            action: {}

        recommendation_actions:
          name: Empfehlung für reguläre Fenster
          description: >-
            Wird nur verwendet, wenn die optionale Vorwarnung aktiviert ist und die
            reguläre Warnschwelle noch nicht erreicht wurde. In Nachrichtentemplates
            steht {{ recommendation_message }} zur Verfügung.
          default:
            - action: persistent_notification.create
              data:
                notification_id: weather_window_recommendation
                title: "🌦️ Fenster vorsorglich schließen"
                message: "{{ recommendation_message }}"
          selector:
            action: {}

        data_problem_actions:
          name: Benachrichtigung bei fehlenden Wetterdaten
          description: >-
            Wird ausgeführt, wenn ein relevantes Fensterproblem besteht, der
            ausgewählte Forecast-Wert aber vom Wetteranbieter nicht geliefert wird.
            In Nachrichtentemplates steht {{ data_problem_message }} zur Verfügung.
          default:
            - action: persistent_notification.create
              data:
                notification_id: weather_window_missing_forecast_data
                title: "Wetterdaten für Fensterwarnung unvollständig"
                message: "{{ data_problem_message }}"
          selector:
            action: {}

        clearance_enabled:
          name: Entwarnung aktivieren
          description: >-
            Sendet eine Entwarnung, sobald zuvor beanstandete Fenster der jeweiligen
            Gruppe wieder geschlossen sind und ihre Sensoren einen verlässlichen
            Zustand liefern. Für eine zuverlässige Speicherung über mehrere Läufe
            sollte unten je verwendeter Gruppe ein input_boolean-Helper gewählt werden.
          default: true
          selector:
            boolean: {}

        critical_alert_state_helper:
          name: Status-Helper – kritische Fenster (optional)
          description: >-
            Optionaler input_boolean-Helper. Der Blueprint schaltet ihn bei einer
            kritischen Warnung ein und nach erfolgreicher Entwarnung wieder aus.
            Damit bleibt gespeichert, dass tatsächlich eine Warnung aktiv war.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean

        regular_alert_state_helper:
          name: Status-Helper – reguläre Fenster (optional)
          description: >-
            Optionaler input_boolean-Helper für reguläre Fenster. Funktioniert analog
            zum Status-Helper der kritischen Fenster.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean

        clearance_actions:
          name: Entwarnungs-Benachrichtigung
          description: >-
            Wird gesendet, wenn eine zuvor gewarnte Fenstergruppe wieder in Ordnung
            ist. In Nachrichtentemplates steht {{ clearance_message }} zur Verfügung.
          default:
            - action: persistent_notification.create
              data:
                notification_id: weather_window_clearance
                title: "✅ Fenster-Entwarnung"
                message: "{{ clearance_message }}"
          selector:
            action: {}

        cooldown_minutes:
          name: Cooldown nach Warnung
          description: >-
            Nach einer tatsächlich gesendeten Warnung bleibt diese Automation für
            die eingestellte Zeit aktiv und ignoriert weitere Trigger. Dadurch werden
            identische Erinnerungen unterdrückt. 0 deaktiviert den Cooldown.
            Hinweis: Der Cooldown gilt gemeinsam für kritische Fenster, reguläre
            Fenster und fehlende Wetterdaten. Eine Entwarnung aus einem späteren
            Lauf kann daher frühestens nach Ende dieses Cooldowns verarbeitet werden.
          default: 30
          selector:
            number:
              min: 0
              max: 360
              step: 5
              unit_of_measurement: min
              mode: slider

triggers: !input check_triggers

variables:
  weather_entity: !input weather_entity
  weather_conditions: !input weather_conditions
  forecast_hours: !input forecast_hours

  critical_windows: !input critical_windows
  critical_threshold_type: !input critical_threshold_type
  critical_probability: !input critical_probability
  critical_amount: !input critical_amount

  regular_windows: !input regular_windows
  regular_threshold_type: !input regular_threshold_type
  regular_probability: !input regular_probability
  regular_amount: !input regular_amount
  recommend_regular_with_critical: !input recommend_regular_with_critical
  regular_prewarning_enabled: !input regular_prewarning_enabled
  regular_prewarning_percent: !input regular_prewarning_percent

  stale_minutes: !input stale_minutes
  clearance_enabled: !input clearance_enabled
  critical_alert_state_helper: !input critical_alert_state_helper
  regular_alert_state_helper: !input regular_alert_state_helper
  cooldown_minutes: !input cooldown_minutes

conditions: []

actions:
  - if:
      - condition: template
        value_template: "{{ not has_value(weather_entity) }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: weather_window_weather_entity_unavailable
          title: "Wetterprüfung nicht möglich"
          message: >-
            Die Wetter-Entität {{ weather_entity }} ist unknown oder unavailable.
      - stop: "Wetter-Entität nicht verfügbar"

  - action: weather.get_forecasts
    target:
      entity_id: !input weather_entity
    data:
      type: hourly
    response_variable: weather_response

  - variables:
      precipitation_unit: "{{ state_attr(weather_entity, 'precipitation_unit') or 'Wetter-Einheit' }}"
      forecast_list: >-
        {{ weather_response[weather_entity].forecast | default([], true) }}

  - variables:
      relevant_forecast: >-
        {% set ns = namespace(items=[]) %}
        {% set start_ts = as_timestamp(now()) - 3600 %}
        {% set end_ts = as_timestamp(now()) + ((forecast_hours | float(0)) * 3600) %}
        {% for f in forecast_list %}
          {% if f.datetime is defined and f.condition is defined %}
            {% set ts = as_timestamp(f.datetime) %}
            {% if ts >= start_ts and ts <= end_ts and f.condition in weather_conditions %}
              {% set ns.items = ns.items + [f] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

      critical_open: >-
        {% set ns = namespace(items=[]) %}
        {% for e in critical_windows %}
          {% if is_state(e, 'on') %}
            {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

      critical_unknown: >-
        {% set ns = namespace(items=[]) %}
        {% for e in critical_windows %}
          {% if states(e) in ['unknown', 'unavailable'] %}
            {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

      critical_stale: >-
        {% set ns = namespace(items=[]) %}
        {% if stale_minutes | int(0) > 0 %}
          {% for e in critical_windows %}
            {% if states(e) not in ['unknown', 'unavailable'] %}
              {% set obj = (expand(e) | list | first) | default(none) %}
              {% if obj is not none and obj.last_reported is defined %}
                {% set age = as_timestamp(now()) - as_timestamp(obj.last_reported) %}
                {% if age >= ((stale_minutes | int(0)) * 60) %}
                  {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.items }}

      regular_open: >-
        {% set ns = namespace(items=[]) %}
        {% for e in regular_windows %}
          {% if is_state(e, 'on') %}
            {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

      regular_unknown: >-
        {% set ns = namespace(items=[]) %}
        {% for e in regular_windows %}
          {% if states(e) in ['unknown', 'unavailable'] %}
            {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

      regular_stale: >-
        {% set ns = namespace(items=[]) %}
        {% if stale_minutes | int(0) > 0 %}
          {% for e in regular_windows %}
            {% if states(e) not in ['unknown', 'unavailable'] %}
              {% set obj = (expand(e) | list | first) | default(none) %}
              {% if obj is not none and obj.last_reported is defined %}
                {% set age = as_timestamp(now()) - as_timestamp(obj.last_reported) %}
                {% if age >= ((stale_minutes | int(0)) * 60) %}
                  {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.items }}

  - variables:
      matched_conditions: >-
        {{ relevant_forecast | map(attribute='condition') | unique | list }}

      critical_metric_values: >-
        {% set ns = namespace(values=[]) %}
        {% for f in relevant_forecast %}
          {% if critical_threshold_type == 'probability' %}
            {% if f.precipitation_probability is defined and f.precipitation_probability is not none %}
              {% set ns.values = ns.values + [f.precipitation_probability | float(0)] %}
            {% endif %}
          {% else %}
            {% if f.precipitation is defined and f.precipitation is not none %}
              {% set ns.values = ns.values + [f.precipitation | float(0)] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.values }}

      regular_metric_values: >-
        {% set ns = namespace(values=[]) %}
        {% for f in relevant_forecast %}
          {% if regular_threshold_type == 'probability' %}
            {% if f.precipitation_probability is defined and f.precipitation_probability is not none %}
              {% set ns.values = ns.values + [f.precipitation_probability | float(0)] %}
            {% endif %}
          {% else %}
            {% if f.precipitation is defined and f.precipitation is not none %}
              {% set ns.values = ns.values + [f.precipitation | float(0)] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.values }}

  - variables:
      critical_metric_available: "{{ critical_metric_values | length > 0 }}"
      critical_metric_value: "{{ (critical_metric_values | max) if (critical_metric_values | length > 0) else none }}"
      critical_threshold: "{{ critical_probability if critical_threshold_type == 'probability' else critical_amount }}"

      regular_metric_available: "{{ regular_metric_values | length > 0 }}"
      regular_metric_value: "{{ (regular_metric_values | max) if (regular_metric_values | length > 0) else none }}"
      regular_threshold: "{{ regular_probability if regular_threshold_type == 'probability' else regular_amount }}"
      regular_prewarning_threshold: >-
        {{ (regular_probability if regular_threshold_type == 'probability' else regular_amount)
           | float(0) * (regular_prewarning_percent | float(80)) / 100 }}

      critical_problem_count: >-
        {{ (critical_open | length) + (critical_unknown | length) + (critical_stale | length) }}
      regular_problem_count: >-
        {{ (regular_open | length) + (regular_unknown | length) + (regular_stale | length) }}

  - variables:
      critical_alert: >-
        {{ (relevant_forecast | length > 0)
           and (critical_problem_count | int(0) > 0)
           and critical_metric_available
           and ((critical_metric_value | float(0)) >= (critical_threshold | float(0))) }}

      regular_alert: >-
        {{ (relevant_forecast | length > 0)
           and (regular_problem_count | int(0) > 0)
           and regular_metric_available
           and ((regular_metric_value | float(0)) >= (regular_threshold | float(0))) }}

      regular_prewarning: >-
        {{ regular_prewarning_enabled
           and not critical_alert
           and not regular_alert
           and (relevant_forecast | length > 0)
           and (regular_open | length > 0)
           and regular_metric_available
           and ((regular_metric_value | float(0)) >= (regular_prewarning_threshold | float(0))) }}

      data_problem: >-
        {{ (relevant_forecast | length > 0)
           and (
             ((critical_problem_count | int(0) > 0) and not critical_metric_available)
             or
             ((regular_problem_count | int(0) > 0) and not regular_metric_available)
           ) }}

  - variables:
      critical_clearance_now: >-
        {{ clearance_enabled
           and (critical_alert_state_helper | string | length > 0)
           and is_state(critical_alert_state_helper, 'on')
           and (critical_problem_count | int(0) == 0) }}
      regular_clearance_now: >-
        {{ clearance_enabled
           and (regular_alert_state_helper | string | length > 0)
           and is_state(regular_alert_state_helper, 'on')
           and (regular_problem_count | int(0) == 0) }}

  - variables:
      critical_message: >-
        {% set metric_name = 'Regenwahrscheinlichkeit' if critical_threshold_type == 'probability' else 'Niederschlagsmenge' %}
        {% set unit = '%' if critical_threshold_type == 'probability' else precipitation_unit %}
        {% set reg_metric_name = 'Regenwahrscheinlichkeit' if regular_threshold_type == 'probability' else 'Niederschlagsmenge' %}
        {% set reg_unit = '%' if regular_threshold_type == 'probability' else precipitation_unit %}
        ⚠️ Wetterwarnung für kritische Fenster

        Relevantes Wetter in den nächsten {{ forecast_hours }} h: {{ matched_conditions | join(', ') }}.
        {{ metric_name }}: max. {{ critical_metric_value }} {{ unit }} (kritische Schwelle {{ critical_threshold }} {{ unit }}).

        {% if critical_open | length > 0 %}
        Sofort schließen:
        {% for item in critical_open %}• {{ item }}
        {% endfor %}
        {% endif %}
        {% if critical_unknown | length > 0 %}
        ⚠️ Status kritischer Sensoren nicht verfügbar:
        {% for item in critical_unknown %}• {{ item }}
        {% endfor %}
        {% endif %}
        {% if critical_stale | length > 0 %}
        ⚠️ Keine aktuelle Rückmeldung kritischer Sensoren:
        {% for item in critical_stale %}• {{ item }}
        {% endfor %}
        {% endif %}

        {% if recommend_regular_with_critical and (regular_open | length > 0) and not regular_alert %}
        Empfohlen zu schließen:
        {% for item in regular_open %}• {{ item }}
        {% endfor %}
        {% if regular_metric_available %}
        Die reguläre Warnschwelle ist noch nicht erreicht: {{ reg_metric_name }} max. {{ regular_metric_value }} {{ reg_unit }} (Warnung ab {{ regular_threshold }} {{ reg_unit }}).
        {% else %}
        Die reguläre Warnschwelle konnte wegen fehlender Forecast-Daten nicht ausgewertet werden.
        {% endif %}
        {% endif %}
        {% if (regular_unknown | length > 0) and not regular_alert %}
        Hinweis – Status regulärer Sensoren unbekannt/unavailable: {{ regular_unknown | join(', ') }}.
        {% endif %}
        {% if (regular_stale | length > 0) and not regular_alert %}
        Hinweis – keine aktuelle Rückmeldung regulärer Sensoren: {{ regular_stale | join(', ') }}.
        {% endif %}

      regular_message: >-
        {% set metric_name = 'Regenwahrscheinlichkeit' if regular_threshold_type == 'probability' else 'Niederschlagsmenge' %}
        {% set unit = '%' if regular_threshold_type == 'probability' else precipitation_unit %}
        🌧️ Warnschwelle für reguläre Fenster erreicht

        Relevantes Wetter in den nächsten {{ forecast_hours }} h: {{ matched_conditions | join(', ') }}.
        {{ metric_name }}: max. {{ regular_metric_value }} {{ unit }} (Schwelle {{ regular_threshold }} {{ unit }}).
        {% if regular_open | length > 0 %}
        Bitte schließen:
        {% for item in regular_open %}• {{ item }}
        {% endfor %}
        {% endif %}
        {% if regular_unknown | length > 0 %}
        ⚠️ Status nicht verfügbar: {{ regular_unknown | join(', ') }}.
        {% endif %}
        {% if regular_stale | length > 0 %}
        ⚠️ Keine aktuelle Rückmeldung: {{ regular_stale | join(', ') }}.
        {% endif %}

      recommendation_message: >-
        {% set metric_name = 'Regenwahrscheinlichkeit' if regular_threshold_type == 'probability' else 'Niederschlagsmenge' %}
        {% set unit = '%' if regular_threshold_type == 'probability' else precipitation_unit %}
        🌦️ Vorsorgliche Empfehlung

        Für die nächsten {{ forecast_hours }} h ist relevantes Wetter vorhergesagt ({{ matched_conditions | join(', ') }}).
        {{ metric_name }}: max. {{ regular_metric_value }} {{ unit }}.
        Die eigentliche Warnschwelle liegt bei {{ regular_threshold }} {{ unit }}; die Vorwarnung beginnt bei {{ regular_prewarning_threshold | round(2) }} {{ unit }}.

        Noch offen – vorsorglich schließen empfohlen:
        {% for item in regular_open %}• {{ item }}
        {% endfor %}

      clearance_message: >-
        ✅ Entwarnung

        {% if critical_clearance_now %}
        Kritische Fenster: Alle zuvor beanstandeten Fenster sind wieder geschlossen
        und die ausgewählten Sensoren liefern einen verlässlichen Zustand.
        {% endif %}
        {% if regular_clearance_now %}
        Reguläre Fenster: Alle zuvor beanstandeten Fenster sind wieder geschlossen
        und die ausgewählten Sensoren liefern einen verlässlichen Zustand.
        {% endif %}

        Die Entwarnung bezieht sich auf den Fensterstatus. Die Wettervorhersage kann
        weiterhin Regen oder andere ausgewählte Wetterzustände enthalten.

      data_problem_message: >-
        Relevantes Wetter wurde erkannt ({{ matched_conditions | join(', ') }}), aber der ausgewählte
        Wetteranbieter liefert nicht alle benötigten Forecast-Daten.
        {% if (critical_problem_count | int(0) > 0) and not critical_metric_available %}
        Kritische Fenster: Für die gewählte Schwellenart "{{ critical_threshold_type }}" fehlt der Wert.
        Betroffen/offen/unklar: {{ (critical_open + critical_unknown + critical_stale) | join(', ') }}.
        {% endif %}
        {% if (regular_problem_count | int(0) > 0) and not regular_metric_available %}
        Reguläre Fenster: Für die gewählte Schwellenart "{{ regular_threshold_type }}" fehlt der Wert.
        Betroffen/offen/unklar: {{ (regular_open + regular_unknown + regular_stale) | join(', ') }}.
        {% endif %}
        Der fehlende Wert wird ausdrücklich nicht als 0 interpretiert.

  # Entwarnung aus einem früheren Lauf. Die optionalen input_boolean-Helper
  # speichern, ob für die jeweilige Gruppe tatsächlich eine Warnung aktiv war.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ critical_clearance_now or regular_clearance_now }}"
        sequence: !input clearance_actions

  - if:
      - condition: template
        value_template: "{{ critical_clearance_now }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ critical_alert_state_helper }}"

  - if:
      - condition: template
        value_template: "{{ regular_clearance_now }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ regular_alert_state_helper }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ critical_alert }}"
        sequence: !input critical_actions

  - if:
      - condition: template
        value_template: >-
          {{ critical_alert and (critical_alert_state_helper | string | length > 0) }}
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ critical_alert_state_helper }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ regular_alert }}"
        sequence: !input regular_actions

  - if:
      - condition: template
        value_template: >-
          {{ regular_alert and (regular_alert_state_helper | string | length > 0) }}
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ regular_alert_state_helper }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ regular_prewarning }}"
        sequence: !input recommendation_actions

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ data_problem }}"
        sequence: !input data_problem_actions

  # Helper-freier Cooldown: Nur wenn in diesem Lauf wirklich eine Warnung
  # ausgelöst wurde, bleibt die Automation für die konfigurierte Zeit aktiv.
  # Mit mode: single werden weitere Trigger währenddessen verworfen.
  - if:
      - condition: template
        value_template: >-
          {{ (cooldown_minutes | int(0) > 0)
             and (critical_alert or regular_alert or regular_prewarning or data_problem) }}
    then:
      - delay:
          minutes: "{{ cooldown_minutes | int(0) }}"

      # Direkt nach dem Cooldown noch einmal den LIVE-Sensorzustand prüfen. So kann
      # eine Entwarnung gesendet werden, ohne auf den nächsten Zeit-Trigger zu warten.
      - variables:
          critical_resolved_after_cooldown: >-
            {% set ns = namespace(ok=true) %}
            {% if clearance_enabled and (critical_alert_state_helper | string | length > 0) and is_state(critical_alert_state_helper, 'on') %}
              {% for e in critical_windows %}
                {% if states(e) != 'off' %}
                  {% set ns.ok = false %}
                {% elif stale_minutes | int(0) > 0 %}
                  {% set obj = (expand(e) | list | first) | default(none) %}
                  {% if obj is not none and obj.last_reported is defined %}
                    {% set age = as_timestamp(now()) - as_timestamp(obj.last_reported) %}
                    {% if age >= ((stale_minutes | int(0)) * 60) %}
                      {% set ns.ok = false %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.ok }}
            {% else %}
              false
            {% endif %}
          regular_resolved_after_cooldown: >-
            {% set ns = namespace(ok=true) %}
            {% if clearance_enabled and (regular_alert_state_helper | string | length > 0) and is_state(regular_alert_state_helper, 'on') %}
              {% for e in regular_windows %}
                {% if states(e) != 'off' %}
                  {% set ns.ok = false %}
                {% elif stale_minutes | int(0) > 0 %}
                  {% set obj = (expand(e) | list | first) | default(none) %}
                  {% if obj is not none and obj.last_reported is defined %}
                    {% set age = as_timestamp(now()) - as_timestamp(obj.last_reported) %}
                    {% if age >= ((stale_minutes | int(0)) * 60) %}
                      {% set ns.ok = false %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.ok }}
            {% else %}
              false
            {% endif %}

      - variables:
          clearance_message: >-
            ✅ Entwarnung

            {% if critical_resolved_after_cooldown %}
            Kritische Fenster: Alle zuvor beanstandeten Fenster sind wieder geschlossen
            und die ausgewählten Sensoren liefern einen verlässlichen Zustand.
            {% endif %}
            {% if regular_resolved_after_cooldown %}
            Reguläre Fenster: Alle zuvor beanstandeten Fenster sind wieder geschlossen
            und die ausgewählten Sensoren liefern einen verlässlichen Zustand.
            {% endif %}

            Die Entwarnung bezieht sich auf den Fensterstatus. Die Wettervorhersage kann
            weiterhin Regen oder andere ausgewählte Wetterzustände enthalten.

      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ critical_resolved_after_cooldown or regular_resolved_after_cooldown }}
            sequence: !input clearance_actions

      - if:
          - condition: template
            value_template: "{{ critical_resolved_after_cooldown }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ critical_alert_state_helper }}"

      - if:
          - condition: template
            value_template: "{{ regular_resolved_after_cooldown }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ regular_alert_state_helper }}"

mode: single
max_exceeded: silent
