blueprint:
  name: "Wetterwarnung: offene / unerreichbare Fenster v0.8"
  description: >-
    Prüft aktuellen Wetterzustand und stündlichen Wetter-Forecast und meldet offene
    oder nicht verlässlich rückmeldende Fenstersensoren. Es gibt zwei Fensterkategorien:
    kritische Fenster (z. B. Dachfenster) und reguläre Fenster. Für jede Kategorie kann
    unabhängig gewählt werden, ob die primäre Warnschwelle über Niederschlagswahrscheinlichkeit
    (%) oder Niederschlagsmenge (z. B. mm pro Forecast-Stunde) bestimmt wird.

    Die Wetterauslösung arbeitet fehlertolerant nach einem ODER-Prinzip: Ein ausgewählter
    aktueller Wetterzustand, ein ausgewählter Forecast-Wetterzustand, die primäre numerische
    Schwelle oder optional eine zusätzliche Niederschlagsmengen-Sicherheitsschwelle können
    jeweils unabhängig eine Warnstufe aktivieren. Forecast-Niederschlagswerte werden dabei
    über alle Forecast-Einträge im Vorwarnzeitraum ausgewertet und nicht nur über Einträge,
    deren condition-Feld zu den ausgewählten Wetterzuständen passt.

    Optional können Mobile-App-Notify-Entitäten direkt ausgewählt werden. Diese erhalten
    zusätzlich zu den frei definierbaren Actions einfache Push-Nachrichten über
    notify.send_message.

    unknown/unavailable werden immer separat als unbekannter Sensorzustand gemeldet.
    Für eine echte Kommunikations-/Last-seen-Prüfung können optional separate
    Zeitstempel-Sensoren (z. B. Zigbee2MQTT last_seen) ausgewählt werden. Diese werden
    automatisch über das gemeinsame Home-Assistant-Gerät dem passenden Fensterkontakt
    zugeordnet. Die frühere last_reported-Prüfung bleibt nur als expliziter Legacy-Modus
    verfügbar, da viele batteriebetriebene Kontakte bei unverändertem Zustand nichts
    an Home Assistant melden und sonst fälschlich als veraltet erscheinen.

    Neue Fensterzustände werden ereignisbasiert sofort geprüft. Wird während einer
    relevanten Wetterlage ein weiteres Fenster geöffnet oder ein Sensor unknown/
    unavailable, kann diese neue Situation den Reminder-Cooldown umgehen. Für
    wiederholte Erinnerungen können je Fenstergruppe eigene Timer-Helper genutzt
    werden. Dadurch blockiert ein reguläres Fenster niemals eine neue kritische Warnung.

    Wenn nur die kritische Warnschwelle erreicht ist, können offene reguläre Fenster
    in derselben Meldung als Empfehlung zum Schließen erscheinen. Optional kann für
    reguläre Fenster außerdem ein Vorwarnbereich aktiviert werden, der bereits vor
    Erreichen der regulären Warnschwelle eine Empfehlung sendet.

    Die auswählbaren Kontaktsensoren werden auf Binary-Sensoren der Device Classes
    'window' und 'door' begrenzt. Optional kann je Fenstergruppe ein input_boolean-
    Helper den Warnstatus speichern. Dadurch kann nach dem Schließen der zuvor
    beanstandeten Fenster sofort und gezielt eine Entwarnung gesendet werden.
  domain: automation
  homeassistant:
    min_version: 2026.9.0

  input:
    weather_settings:
      name: Wetter
      input:
        weather_entity:
          name: Wetter-Entität
          description: Muss einen stündlichen Forecast unterstützen.
          selector:
            entity:
              filter:
                - domain: weather

        weather_conditions:
          name: Wetterzustände für kritische Fenster
          description: >-
            Diese Zustände gelten sowohl für den aktuellen Zustand der Wetter-Entität
            als auch für den Forecast. Ein Treffer kann die kritische Wetterstufe
            unabhängig von den numerischen Schwellen aktivieren.
          default:
            - rainy
            - pouring
            - lightning-rainy
            - hail
            - snowy-rainy
          selector:
            select:
              multiple: true
              options:
                - label: Regen
                  value: rainy
                - label: Starkregen
                  value: pouring
                - label: Gewitter mit Regen
                  value: lightning-rainy
                - label: Hagel
                  value: hail
                - label: Schneeregen
                  value: snowy-rainy
                - label: Schnee
                  value: snowy

        regular_weather_conditions:
          name: Wetterzustände für reguläre Fenster
          description: >-
            Wetterzustände, die auch ohne Erreichen einer numerischen Schwelle direkt
            eine Warnung für reguläre Fenster auslösen. Standardmäßig sind hier nur
            stärkere Wetterlagen ausgewählt.
          default:
            - pouring
            - lightning-rainy
            - hail
          selector:
            select:
              multiple: true
              options:
                - label: Regen
                  value: rainy
                - label: Starkregen
                  value: pouring
                - label: Gewitter mit Regen
                  value: lightning-rainy
                - label: Hagel
                  value: hail
                - label: Schneeregen
                  value: snowy-rainy
                - label: Schnee
                  value: snowy

        forecast_hours:
          name: Vorwarnzeitraum
          description: Wie viele Stunden des Hourly-Forecasts ausgewertet werden.
          default: 3
          selector:
            number:
              min: 1
              max: 12
              step: 1
              unit_of_measurement: h
              mode: slider

    critical_windows_settings:
      name: Kritische Fenster
      input:
        critical_windows:
          name: Kritische Fenster / Dachfenster
          description: Diese Fenster sollen bei relevantem Wetter möglichst immer geschlossen sein.
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - window
                    - door

        critical_threshold_type:
          name: Schwellenart
          default: probability
          selector:
            select:
              options:
                - label: Regenwahrscheinlichkeit (%)
                  value: probability
                - label: Niederschlagsmenge
                  value: amount

        critical_probability:
          name: Regenwahrscheinlichkeit
          description: Wird nur verwendet, wenn als Schwellenart Regenwahrscheinlichkeit gewählt ist.
          default: 25
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        critical_amount:
          name: Niederschlagsmenge
          description: >-
            Wird nur verwendet, wenn Niederschlagsmenge gewählt ist. Verglichen wird
            der höchste Wert eines Forecast-Eintrags im Vorwarnzeitraum. Die Einheit
            kommt von der Wetter-Entität (bei metrischer Konfiguration meist mm).
          default: 0.2
          selector:
            number:
              min: 0
              max: 50
              step: 0.1
              mode: box

        critical_amount_safety_enabled:
          name: Niederschlagsmenge zusätzlich als Sicherheitsnetz
          description: >-
            Wenn aktiv, löst die unten eingestellte Niederschlagsmenge die kritische
            Wetterstufe zusätzlich aus – auch wenn als primäre Schwelle
            Regenwahrscheinlichkeit gewählt wurde und auch wenn der Wetterzustand
            nicht als Regen klassifiziert ist.
          default: true
          selector:
            boolean: {}

        critical_amount_safety:
          name: Sicherheits-Schwelle Niederschlagsmenge – kritisch
          description: >-
            Höchste vorhergesagte Niederschlagsmenge innerhalb einer Forecast-Stunde.
            Einheit entsprechend der Wetter-Entität, typischerweise mm.
          default: 0.2
          selector:
            number:
              min: 0
              max: 50
              step: 0.1
              mode: box

    regular_windows_settings:
      name: Reguläre Fenster
      input:
        regular_windows:
          name: Reguläre Fenster
          description: Diese Fenster werden typischerweise erst bei stärkerem Regen gemeldet.
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - window
                    - door

        regular_threshold_type:
          name: Schwellenart
          default: amount
          selector:
            select:
              options:
                - label: Regenwahrscheinlichkeit (%)
                  value: probability
                - label: Niederschlagsmenge
                  value: amount

        regular_probability:
          name: Regenwahrscheinlichkeit
          description: Wird nur verwendet, wenn als Schwellenart Regenwahrscheinlichkeit gewählt ist.
          default: 60
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        regular_amount:
          name: Niederschlagsmenge
          description: >-
            Wird nur verwendet, wenn Niederschlagsmenge gewählt ist. Verglichen wird
            der höchste Forecast-Wert im Vorwarnzeitraum.
          default: 1.5
          selector:
            number:
              min: 0
              max: 50
              step: 0.1
              mode: box

        regular_amount_safety_enabled:
          name: Niederschlagsmenge zusätzlich als Sicherheitsnetz
          description: >-
            Wenn aktiv, kann eine hohe vorhergesagte Niederschlagsmenge die Warnung
            für reguläre Fenster unabhängig von Wetterzustand und primärer Schwellenart
            auslösen.
          default: true
          selector:
            boolean: {}

        regular_amount_safety:
          name: Sicherheits-Schwelle Niederschlagsmenge – regulär
          description: >-
            Höchste vorhergesagte Niederschlagsmenge innerhalb einer Forecast-Stunde.
            Einheit entsprechend der Wetter-Entität, typischerweise mm.
          default: 1.5
          selector:
            number:
              min: 0
              max: 50
              step: 0.1
              mode: box

        recommend_regular_with_critical:
          name: Reguläre Fenster bei kritischer Warnung empfehlen
          description: >-
            Wenn die kritische Schwelle erreicht ist, aber die reguläre Schwelle noch
            nicht, werden offene reguläre Fenster in der kritischen Nachricht als
            Empfehlung zum Schließen aufgeführt.
          default: true
          selector:
            boolean: {}

        regular_prewarning_enabled:
          name: Vorwarnung für reguläre Fenster
          description: >-
            Optional bereits vor Erreichen der regulären Warnschwelle eine reine
            Empfehlung senden. Die Vorwarnung wird nur für tatsächlich offene
            reguläre Fenster erzeugt.
          default: false
          selector:
            boolean: {}

        regular_prewarning_percent:
          name: Vorwarnung ab Anteil der regulären Schwelle
          description: >-
            Beispiel: 80 % bei einer regulären Schwelle von 60 % bedeutet eine
            Empfehlung ab 48 %. Bei Niederschlagsmenge wird entsprechend gerechnet.
          default: 80
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

    sensor_health_settings:
      name: Sensor-Rückmeldung / Last seen
      input:
        sensor_health_mode:
          name: Prüfung auf fehlende Rückmeldung
          description: >-
            Empfohlen ist „Nur unknown/unavailable“ oder die Prüfung über echte
            Last-seen-Zeitstempel. last_reported des Fensterkontakts ist KEIN
            zuverlässiger Funk-/Lebenszeichen-Zeitpunkt und wird nur noch als
            Legacy-Option angeboten.
          default: availability_only
          selector:
            select:
              options:
                - label: Nur unknown/unavailable (empfohlen ohne Last-seen-Sensoren)
                  value: availability_only
                - label: Echte Last-seen-Zeitstempel verwenden
                  value: last_seen_entities
                - label: Legacy – last_reported des Fensterkontakts
                  value: legacy_last_reported

        last_seen_entities:
          name: Last-seen-Zeitstempel der Fenstergeräte
          description: >-
            Optional. Wähle die Timestamp-Sensoren, die die tatsächliche letzte
            Kommunikation der Fensterkontakte abbilden (z. B. Zigbee2MQTT last_seen).
            Der Blueprint ordnet jeden ausgewählten Zeitstempel über die gemeinsame
            Device-ID automatisch dem zugehörigen Tür-/Fenster-Binary-Sensor zu.
            Fenster ohne passend ausgewählten Zeitstempel werden NICHT als stale
            eingestuft.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: timestamp

        stale_minutes:
          name: Last seen älter als ... Minuten
          description: >-
            0 deaktiviert die Altersprüfung. Im empfohlenen Last-seen-Modus wird der
            Zeitstempel der oben ausgewählten Sensoren geprüft. Im Legacy-Modus wird
            stattdessen weiterhin last_reported des Fensterkontakts verwendet.
          default: 0
          selector:
            number:
              min: 0
              max: 10080
              step: 15
              unit_of_measurement: min
              mode: box

    execution_settings:
      name: Prüfung und Benachrichtigung
      input:
        check_triggers:
          name: Prüf-Trigger
          description: >-
            Standardmäßig wird alle 15 Minuten geprüft. Hier können bei Bedarf weitere
            oder andere Trigger definiert werden.
          default:
            - trigger: time_pattern
              minutes: "/15"
          selector:
            trigger: {}

        mobile_notify_entities:
          name: Handy-Benachrichtigungen (optional)
          description: >-
            Wähle eine oder mehrere Notify-Entitäten der Home-Assistant-Companion-App.
            Diese Geräte erhalten automatisch Push-Nachrichten zusätzlich zu den frei
            konfigurierbaren Actions weiter unten. Ist die Liste leer, wird kein direkter
            Mobile-Push ausgeführt.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: notify
                  integration: mobile_app

        critical_actions:
          name: Zusätzliche Actions für kritische Fenster
          description: >-
            Frei definierbare Actions. In Nachrichtentemplates steht
            {{ critical_message }} zur Verfügung.
          default:
            - action: persistent_notification.create
              data:
                notification_id: weather_window_critical
                title: "⚠️ Kritisches Fenster + Wetter"
                message: "{{ critical_message }}"
          selector:
            action: {}

        regular_actions:
          name: Zusätzliche Actions für reguläre Fenster
          description: >-
            Frei definierbare Actions. In Nachrichtentemplates steht
            {{ regular_message }} zur Verfügung.
          default:
            - action: persistent_notification.create
              data:
                notification_id: weather_window_regular
                title: "🌧️ Fenster + stärkerer Niederschlag"
                message: "{{ regular_message }}"
          selector:
            action: {}

        recommendation_actions:
          name: Zusätzliche Actions für Empfehlungen
          description: >-
            Wird nur verwendet, wenn die optionale Vorwarnung aktiviert ist und die
            reguläre Warnschwelle noch nicht erreicht wurde. In Nachrichtentemplates
            steht {{ recommendation_message }} zur Verfügung.
          default:
            - action: persistent_notification.create
              data:
                notification_id: weather_window_recommendation
                title: "🌦️ Fenster vorsorglich schließen"
                message: "{{ recommendation_message }}"
          selector:
            action: {}

        data_problem_actions:
          name: Zusätzliche Actions bei fehlenden Wetterdaten
          description: >-
            Wird ausgeführt, wenn ein relevantes Fensterproblem besteht, der
            ausgewählte Forecast-Wert aber vom Wetteranbieter nicht geliefert wird.
            In Nachrichtentemplates steht {{ data_problem_message }} zur Verfügung.
          default:
            - action: persistent_notification.create
              data:
                notification_id: weather_window_missing_forecast_data
                title: "Wetterdaten für Fensterwarnung unvollständig"
                message: "{{ data_problem_message }}"
          selector:
            action: {}

        clearance_enabled:
          name: Entwarnung aktivieren
          description: >-
            Sendet eine Entwarnung, sobald zuvor beanstandete Fenster der jeweiligen
            Gruppe wieder geschlossen sind und ihre Sensoren einen verlässlichen
            Zustand liefern. Für eine zuverlässige Speicherung über mehrere Läufe
            sollte unten je verwendeter Gruppe ein input_boolean-Helper gewählt werden.
          default: true
          selector:
            boolean: {}

        critical_alert_state_helper:
          name: Status-Helper – kritische Fenster (optional)
          description: >-
            Optionaler input_boolean-Helper. Der Blueprint schaltet ihn bei einer
            kritischen Warnung ein und nach erfolgreicher Entwarnung wieder aus.
            Damit bleibt gespeichert, dass tatsächlich eine Warnung aktiv war.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean

        regular_alert_state_helper:
          name: Status-Helper – reguläre Fenster (optional)
          description: >-
            Optionaler input_boolean-Helper für reguläre Fenster. Funktioniert analog
            zum Status-Helper der kritischen Fenster.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean

        clearance_actions:
          name: Zusätzliche Actions für Entwarnung
          description: >-
            Wird gesendet, wenn eine zuvor gewarnte Fenstergruppe wieder in Ordnung
            ist. In Nachrichtentemplates steht {{ clearance_message }} zur Verfügung.
          default:
            - action: persistent_notification.create
              data:
                notification_id: weather_window_clearance
                title: "✅ Fenster-Entwarnung"
                message: "{{ clearance_message }}"
          selector:
            action: {}

        critical_cooldown_timer:
          name: Cooldown-Timer – kritische Fenster (optional)
          description: >-
            Optionaler Timer-Helper für Erinnerungen der kritischen Fenster. Während
            der Timer aktiv ist, werden identische Wiederholungen unterdrückt. Eine
            neu geöffnete Tür/ein neues Fenster oder ein neu ausgefallener Sensor
            kann den Cooldown trotzdem umgehen. Am besten beim Timer-Helper
            "Wiederherstellen" aktivieren.
          default: ""
          selector:
            entity:
              filter:
                - domain: timer

        critical_cooldown_minutes:
          name: Reminder-Intervall – kritische Fenster
          description: Dauer, mit der der kritische Cooldown-Timer nach einer Meldung gestartet wird.
          default: 15
          selector:
            number:
              min: 0
              max: 360
              step: 5
              unit_of_measurement: min
              mode: slider

        regular_cooldown_timer:
          name: Cooldown-Timer – reguläre Fenster (optional)
          description: >-
            Optionaler eigener Timer-Helper für reguläre Warnungen und Empfehlungen.
            Kritische und reguläre Fenster beeinflussen sich damit beim Cooldown nicht.
            Am besten beim Timer-Helper "Wiederherstellen" aktivieren.
          default: ""
          selector:
            entity:
              filter:
                - domain: timer

        regular_cooldown_minutes:
          name: Reminder-Intervall – reguläre Fenster
          description: Dauer, mit der der reguläre Cooldown-Timer nach einer Meldung gestartet wird.
          default: 30
          selector:
            number:
              min: 0
              max: 360
              step: 5
              unit_of_measurement: min
              mode: slider

        bypass_cooldown_on_new_problem:
          name: Neue Fenster-/Sensorprobleme sofort melden
          description: >-
            Wenn aktiv, wird ein neu geöffnetes Fenster bzw. ein neu auf unknown oder
            unavailable wechselnder Sensor sofort gemeldet, auch wenn der Timer-Cooldown
            der jeweiligen Gruppe noch läuft.
          default: true
          selector:
            boolean: {}

triggers:
  - triggers: !input check_triggers
  - trigger: state
    entity_id: !input critical_windows
    from:
    id: ww_critical_window_state
  - trigger: state
    entity_id: !input regular_windows
    from:
    id: ww_regular_window_state
  - trigger: state
    entity_id: !input weather_entity
    from:
    id: ww_weather_state

variables:
  weather_entity: !input weather_entity
  weather_conditions: !input weather_conditions
  regular_weather_conditions: !input regular_weather_conditions
  forecast_hours: !input forecast_hours

  critical_windows: !input critical_windows
  critical_threshold_type: !input critical_threshold_type
  critical_probability: !input critical_probability
  critical_amount: !input critical_amount
  critical_amount_safety_enabled: !input critical_amount_safety_enabled
  critical_amount_safety: !input critical_amount_safety

  regular_windows: !input regular_windows
  regular_threshold_type: !input regular_threshold_type
  regular_probability: !input regular_probability
  regular_amount: !input regular_amount
  regular_amount_safety_enabled: !input regular_amount_safety_enabled
  regular_amount_safety: !input regular_amount_safety
  recommend_regular_with_critical: !input recommend_regular_with_critical
  regular_prewarning_enabled: !input regular_prewarning_enabled
  regular_prewarning_percent: !input regular_prewarning_percent

  sensor_health_mode: !input sensor_health_mode
  last_seen_entities: !input last_seen_entities
  stale_minutes: !input stale_minutes
  clearance_enabled: !input clearance_enabled
  critical_alert_state_helper: !input critical_alert_state_helper
  regular_alert_state_helper: !input regular_alert_state_helper

  critical_cooldown_timer: !input critical_cooldown_timer
  critical_cooldown_minutes: !input critical_cooldown_minutes
  regular_cooldown_timer: !input regular_cooldown_timer
  regular_cooldown_minutes: !input regular_cooldown_minutes
  bypass_cooldown_on_new_problem: !input bypass_cooldown_on_new_problem
  mobile_notify_entities: !input mobile_notify_entities

  trigger_id: >-
    {{ trigger.id | default('') if trigger is defined else '' }}
  trigger_entity_id: >-
    {{ trigger.entity_id | default('') if trigger is defined else '' }}
  trigger_from_state: >-
    {{ trigger.from_state.state | default('') if trigger is defined and trigger.from_state is not none else '' }}
  trigger_to_state: >-
    {{ trigger.to_state.state | default('') if trigger is defined and trigger.to_state is not none else '' }}
  critical_new_problem_event: >-
    {{ trigger is defined
       and (trigger.id | default('')) == 'ww_critical_window_state'
       and trigger.to_state is not none
       and trigger.to_state.state in ['on', 'unknown', 'unavailable']
       and (trigger.from_state is none or trigger.from_state.state != trigger.to_state.state) }}
  regular_new_problem_event: >-
    {{ trigger is defined
       and (trigger.id | default('')) == 'ww_regular_window_state'
       and trigger.to_state is not none
       and trigger.to_state.state in ['on', 'unknown', 'unavailable']
       and (trigger.from_state is none or trigger.from_state.state != trigger.to_state.state) }}
  triggered_window_name: >-
    {{ (state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id)
       if trigger is defined and trigger.entity_id is defined else '' }}

conditions: []

actions:
  # Zuerst nur die Fenster auswerten. Dadurch kann eine Entwarnung sofort erfolgen,
  # ohne dass sie von Wetter-Forecast oder Cooldown abhängig ist.
  - variables:
      critical_open: >-
        {% set ns = namespace(items=[]) %}
        {% for e in critical_windows %}
          {% if is_state(e, 'on') %}
            {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

      critical_unknown: >-
        {% set ns = namespace(items=[]) %}
        {% for e in critical_windows %}
          {% if states(e) in ['unknown', 'unavailable'] %}
            {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

      critical_stale: >-
        {% set ns = namespace(items=[]) %}
        {% set limit = (stale_minutes | int(0)) * 60 %}
        {% if sensor_health_mode == 'last_seen_entities' and limit > 0 %}
          {% for e in critical_windows %}
            {% if states(e) not in ['unknown', 'unavailable'] %}
              {% set dev = device_id(e) %}
              {% set seen = namespace(matched=false, latest=none) %}
              {% if dev is not none %}
                {% for ls in last_seen_entities %}
                  {% if device_id(ls) == dev %}
                    {% set seen.matched = true %}
                    {% set ts = as_timestamp(states(ls), default=none) %}
                    {% if ts is not none and (seen.latest is none or ts > seen.latest) %}
                      {% set seen.latest = ts %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {% if seen.matched and (seen.latest is none or (as_timestamp(now()) - seen.latest) >= limit) %}
                {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% elif sensor_health_mode == 'legacy_last_reported' and limit > 0 %}
          {% for e in critical_windows %}
            {% if states(e) not in ['unknown', 'unavailable'] %}
              {% set obj = (expand(e) | list | first) | default(none) %}
              {% if obj is not none and obj.last_reported is defined %}
                {% set age = as_timestamp(now()) - as_timestamp(obj.last_reported) %}
                {% if age >= limit %}
                  {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.items }}

      regular_open: >-
        {% set ns = namespace(items=[]) %}
        {% for e in regular_windows %}
          {% if is_state(e, 'on') %}
            {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

      regular_unknown: >-
        {% set ns = namespace(items=[]) %}
        {% for e in regular_windows %}
          {% if states(e) in ['unknown', 'unavailable'] %}
            {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

      regular_stale: >-
        {% set ns = namespace(items=[]) %}
        {% set limit = (stale_minutes | int(0)) * 60 %}
        {% if sensor_health_mode == 'last_seen_entities' and limit > 0 %}
          {% for e in regular_windows %}
            {% if states(e) not in ['unknown', 'unavailable'] %}
              {% set dev = device_id(e) %}
              {% set seen = namespace(matched=false, latest=none) %}
              {% if dev is not none %}
                {% for ls in last_seen_entities %}
                  {% if device_id(ls) == dev %}
                    {% set seen.matched = true %}
                    {% set ts = as_timestamp(states(ls), default=none) %}
                    {% if ts is not none and (seen.latest is none or ts > seen.latest) %}
                      {% set seen.latest = ts %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {% if seen.matched and (seen.latest is none or (as_timestamp(now()) - seen.latest) >= limit) %}
                {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% elif sensor_health_mode == 'legacy_last_reported' and limit > 0 %}
          {% for e in regular_windows %}
            {% if states(e) not in ['unknown', 'unavailable'] %}
              {% set obj = (expand(e) | list | first) | default(none) %}
              {% if obj is not none and obj.last_reported is defined %}
                {% set age = as_timestamp(now()) - as_timestamp(obj.last_reported) %}
                {% if age >= limit %}
                  {% set ns.items = ns.items + [state_attr(e, 'friendly_name') or e] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.items }}

  - variables:
      critical_problem_count: >-
        {{ (critical_open | length) + (critical_unknown | length) + (critical_stale | length) }}
      regular_problem_count: >-
        {{ (regular_open | length) + (regular_unknown | length) + (regular_stale | length) }}

      critical_clearance_now: >-
        {{ clearance_enabled
           and (critical_alert_state_helper | string | length > 0)
           and is_state(critical_alert_state_helper, 'on')
           and ((critical_open | length) + (critical_unknown | length) + (critical_stale | length) == 0) }}
      regular_clearance_now: >-
        {{ clearance_enabled
           and (regular_alert_state_helper | string | length > 0)
           and is_state(regular_alert_state_helper, 'on')
           and ((regular_open | length) + (regular_unknown | length) + (regular_stale | length) == 0) }}

  - variables:
      clearance_message: >-
        ✅ Entwarnung

        {% if critical_clearance_now %}
        Kritische Fenster: Alle zuvor beanstandeten Fenster sind wieder geschlossen
        und die ausgewählten Sensoren liefern einen verlässlichen Zustand.
        {% endif %}
        {% if regular_clearance_now %}
        Reguläre Fenster: Alle zuvor beanstandeten bzw. empfohlenen Fenster sind wieder
        geschlossen und die ausgewählten Sensoren liefern einen verlässlichen Zustand.
        {% endif %}

        Die Entwarnung bezieht sich auf den Fensterstatus. Die Wetterlage kann weiterhin
        relevant sein.

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ critical_clearance_now or regular_clearance_now }}"
        sequence: !input clearance_actions

  - if:
      - condition: template
        value_template: >-
          {{ (critical_clearance_now or regular_clearance_now)
             and (mobile_notify_entities | length > 0) }}
    then:
      - action: notify.send_message
        target:
          entity_id: !input mobile_notify_entities
        data:
          title: "✅ Fenster-Entwarnung"
          message: "{{ clearance_message }}"

  - if:
      - condition: template
        value_template: "{{ critical_clearance_now }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ critical_alert_state_helper }}"

  - if:
      - condition: template
        value_template: "{{ regular_clearance_now }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ regular_alert_state_helper }}"

  # Sind jetzt alle Fenster unauffällig, ist nach einer eventuellen Entwarnung nichts
  # weiter zu tun. So wird kein Forecast unnötig abgefragt.
  - if:
      - condition: template
        value_template: >-
          {{ (critical_problem_count | int(0) == 0)
             and (regular_problem_count | int(0) == 0) }}
    then:
      - stop: "Alle ausgewählten Fenster/Sensoren sind unauffällig"

  - if:
      - condition: template
        value_template: "{{ not has_value(weather_entity) }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: weather_window_weather_entity_unavailable
          title: "Wetterprüfung nicht möglich"
          message: >-
            Die Wetter-Entität {{ weather_entity }} ist unknown oder unavailable.
            Es bestehen gleichzeitig offene oder unklare Fenster-/Sensorzustände.
      - if:
          - condition: template
            value_template: "{{ mobile_notify_entities | length > 0 }}"
        then:
          - action: notify.send_message
            target:
              entity_id: !input mobile_notify_entities
            data:
              title: "⚠️ Wetterprüfung nicht möglich"
              message: >-
                Die Wetter-Entität {{ weather_entity }} ist unknown oder unavailable.
                Gleichzeitig bestehen offene oder unklare Fenster-/Sensorzustände.
      - stop: "Wetter-Entität nicht verfügbar"

  - action: weather.get_forecasts
    target:
      entity_id: !input weather_entity
    data:
      type: hourly
    response_variable: weather_response

  - variables:
      precipitation_unit: "{{ state_attr(weather_entity, 'precipitation_unit') or 'Wetter-Einheit' }}"
      forecast_list: >-
        {{ weather_response[weather_entity].forecast | default([], true) }}

      forecast_window: >-
        {% set ns = namespace(items=[]) %}
        {% set start_ts = as_timestamp(now()) - 3600 %}
        {% set end_ts = as_timestamp(now()) + ((forecast_hours | float(0)) * 3600) %}
        {% for f in forecast_list %}
          {% if f.datetime is defined %}
            {% set ts = as_timestamp(f.datetime) %}
            {% if ts >= start_ts and ts <= end_ts %}
              {% set ns.items = ns.items + [f] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

  - variables:
      current_weather_condition: "{{ states(weather_entity) }}"
      critical_current_condition_match: >-
        {{ states(weather_entity) in weather_conditions }}
      regular_current_condition_match: >-
        {{ states(weather_entity) in regular_weather_conditions }}

      critical_forecast_condition_matches: >-
        {% set ns = namespace(items=[]) %}
        {% for f in forecast_window %}
          {% if f.condition is defined and f.condition in weather_conditions %}
            {% set ns.items = ns.items + [f.condition] %}
          {% endif %}
        {% endfor %}
        {{ ns.items | unique | list }}

      regular_forecast_condition_matches: >-
        {% set ns = namespace(items=[]) %}
        {% for f in forecast_window %}
          {% if f.condition is defined and f.condition in regular_weather_conditions %}
            {% set ns.items = ns.items + [f.condition] %}
          {% endif %}
        {% endfor %}
        {{ ns.items | unique | list }}

      probability_values: >-
        {% set ns = namespace(values=[]) %}
        {% for f in forecast_window %}
          {% if f.precipitation_probability is defined and f.precipitation_probability is not none %}
            {% set ns.values = ns.values + [f.precipitation_probability | float(0)] %}
          {% endif %}
        {% endfor %}
        {{ ns.values }}

      precipitation_values: >-
        {% set ns = namespace(values=[]) %}
        {% for f in forecast_window %}
          {% if f.precipitation is defined and f.precipitation is not none %}
            {% set ns.values = ns.values + [f.precipitation | float(0)] %}
          {% endif %}
        {% endfor %}
        {{ ns.values }}

  - variables:
      probability_available: "{{ probability_values | length > 0 }}"
      max_probability: "{{ (probability_values | max) if (probability_values | length > 0) else none }}"
      precipitation_available: "{{ precipitation_values | length > 0 }}"
      max_precipitation: "{{ (precipitation_values | max) if (precipitation_values | length > 0) else none }}"

      critical_metric_available: >-
        {{ probability_available if critical_threshold_type == 'probability' else precipitation_available }}
      critical_metric_value: >-
        {{ max_probability if critical_threshold_type == 'probability' else max_precipitation }}
      critical_threshold: "{{ critical_probability if critical_threshold_type == 'probability' else critical_amount }}"

      regular_metric_available: >-
        {{ probability_available if regular_threshold_type == 'probability' else precipitation_available }}
      regular_metric_value: >-
        {{ max_probability if regular_threshold_type == 'probability' else max_precipitation }}
      regular_threshold: "{{ regular_probability if regular_threshold_type == 'probability' else regular_amount }}"
      regular_prewarning_threshold: >-
        {{ ((regular_probability if regular_threshold_type == 'probability' else regular_amount) | float(0))
           * (regular_prewarning_percent | float(80)) / 100 }}

      critical_cooldown_active: >-
        {{ (critical_cooldown_timer | string | length > 0)
           and states(critical_cooldown_timer) in ['active', 'paused'] }}
      regular_cooldown_active: >-
        {{ (regular_cooldown_timer | string | length > 0)
           and states(regular_cooldown_timer) in ['active', 'paused'] }}

  - variables:
      critical_primary_metric_match: >-
        {{ critical_metric_available
           and ((critical_metric_value | float(0)) >= (critical_threshold | float(0))) }}
      regular_primary_metric_match: >-
        {{ regular_metric_available
           and ((regular_metric_value | float(0)) >= (regular_threshold | float(0))) }}

      critical_amount_safety_match: >-
        {{ critical_amount_safety_enabled
           and precipitation_available
           and ((max_precipitation | float(0)) >= (critical_amount_safety | float(0))) }}
      regular_amount_safety_match: >-
        {{ regular_amount_safety_enabled
           and precipitation_available
           and ((max_precipitation | float(0)) >= (regular_amount_safety | float(0))) }}

      critical_condition_match: >-
        {{ critical_current_condition_match or (critical_forecast_condition_matches | length > 0) }}
      regular_condition_match: >-
        {{ regular_current_condition_match or (regular_forecast_condition_matches | length > 0) }}

      critical_weather_active: >-
        {{ critical_condition_match or critical_primary_metric_match or critical_amount_safety_match }}
      regular_weather_active: >-
        {{ regular_condition_match or regular_primary_metric_match or regular_amount_safety_match }}
      regular_prewarning_weather_active: >-
        {{ regular_prewarning_enabled
           and regular_metric_available
           and ((regular_metric_value | float(0)) >= (regular_prewarning_threshold | float(0))) }}

      critical_trigger_reasons: >-
        {% set ns = namespace(items=[]) %}
        {% if critical_current_condition_match %}{% set ns.items = ns.items + ['aktueller Wetterzustand: ' ~ current_weather_condition] %}{% endif %}
        {% if critical_forecast_condition_matches | length > 0 %}{% set ns.items = ns.items + ['Forecast-Wetterzustand: ' ~ (critical_forecast_condition_matches | join(', '))] %}{% endif %}
        {% if critical_primary_metric_match %}
          {% set label = 'Regenwahrscheinlichkeit' if critical_threshold_type == 'probability' else 'Niederschlagsmenge' %}
          {% set unit = '%' if critical_threshold_type == 'probability' else precipitation_unit %}
          {% set ns.items = ns.items + [label ~ ' ' ~ critical_metric_value ~ ' ' ~ unit ~ ' ≥ ' ~ critical_threshold ~ ' ' ~ unit] %}
        {% endif %}
        {% if critical_amount_safety_match and not (critical_threshold_type == 'amount' and critical_primary_metric_match) %}
          {% set ns.items = ns.items + ['Niederschlags-Sicherheitsnetz ' ~ max_precipitation ~ ' ' ~ precipitation_unit ~ ' ≥ ' ~ critical_amount_safety ~ ' ' ~ precipitation_unit] %}
        {% endif %}
        {{ ns.items }}

      regular_trigger_reasons: >-
        {% set ns = namespace(items=[]) %}
        {% if regular_current_condition_match %}{% set ns.items = ns.items + ['aktueller Wetterzustand: ' ~ current_weather_condition] %}{% endif %}
        {% if regular_forecast_condition_matches | length > 0 %}{% set ns.items = ns.items + ['Forecast-Wetterzustand: ' ~ (regular_forecast_condition_matches | join(', '))] %}{% endif %}
        {% if regular_primary_metric_match %}
          {% set label = 'Regenwahrscheinlichkeit' if regular_threshold_type == 'probability' else 'Niederschlagsmenge' %}
          {% set unit = '%' if regular_threshold_type == 'probability' else precipitation_unit %}
          {% set ns.items = ns.items + [label ~ ' ' ~ regular_metric_value ~ ' ' ~ unit ~ ' ≥ ' ~ regular_threshold ~ ' ' ~ unit] %}
        {% endif %}
        {% if regular_amount_safety_match and not (regular_threshold_type == 'amount' and regular_primary_metric_match) %}
          {% set ns.items = ns.items + ['Niederschlags-Sicherheitsnetz ' ~ max_precipitation ~ ' ' ~ precipitation_unit ~ ' ≥ ' ~ regular_amount_safety ~ ' ' ~ precipitation_unit] %}
        {% endif %}
        {{ ns.items }}

  - variables:
      critical_alert: >-
        {{ critical_weather_active and (critical_problem_count | int(0) > 0) }}
      regular_alert: >-
        {{ regular_weather_active and (regular_problem_count | int(0) > 0) }}

      regular_recommendation_due_to_critical: >-
        {{ recommend_regular_with_critical
           and critical_weather_active
           and not regular_weather_active
           and (regular_open | length > 0) }}
      regular_recommendation_due_to_prewarning: >-
        {{ regular_prewarning_weather_active
           and not regular_weather_active
           and (regular_open | length > 0) }}
      regular_recommendation: >-
        {{ not regular_alert
           and (regular_recommendation_due_to_critical or regular_recommendation_due_to_prewarning) }}

      critical_data_problem: >-
        {{ (forecast_window | length > 0)
           and (critical_problem_count | int(0) > 0)
           and not critical_metric_available
           and not critical_condition_match
           and not critical_amount_safety_match }}
      regular_data_problem: >-
        {{ (forecast_window | length > 0)
           and (regular_problem_count | int(0) > 0)
           and not regular_metric_available
           and not regular_condition_match
           and not regular_amount_safety_match }}

      critical_repeat_allowed: >-
        {{ (critical_cooldown_minutes | int(0) <= 0)
           or (critical_cooldown_timer | string | length == 0)
           or not critical_cooldown_active }}
      regular_repeat_allowed: >-
        {{ (regular_cooldown_minutes | int(0) <= 0)
           or (regular_cooldown_timer | string | length == 0)
           or not regular_cooldown_active }}

      critical_bypass_cooldown: >-
        {{ bypass_cooldown_on_new_problem and critical_new_problem_event }}
      regular_bypass_cooldown: >-
        {{ bypass_cooldown_on_new_problem and regular_new_problem_event }}

  - variables:
      critical_should_notify: >-
        {{ critical_alert and (critical_repeat_allowed or critical_bypass_cooldown) }}
      regular_should_notify: >-
        {{ regular_alert and (regular_repeat_allowed or regular_bypass_cooldown) }}

      regular_recommendation_should_notify: >-
        {{ regular_recommendation
           and (regular_repeat_allowed or regular_bypass_cooldown)
           and (
             not critical_alert
             or (
               regular_new_problem_event
               and not critical_should_notify
             )
           ) }}

      critical_data_problem_should_notify: >-
        {{ critical_data_problem and (critical_repeat_allowed or critical_bypass_cooldown) }}
      regular_data_problem_should_notify: >-
        {{ regular_data_problem and (regular_repeat_allowed or regular_bypass_cooldown) }}

  - variables:
      critical_title: "⚠️ Kritisches Fenster + Wetter"
      regular_title: "🌧️ Fenster + stärkerer Niederschlag"
      recommendation_title: "🌦️ Fenster vorsorglich schließen"
      clearance_title: "✅ Fenster-Entwarnung"
      data_problem_title: "Wetterdaten für Fensterwarnung unvollständig"

      critical_message: >-
        ⚠️ Wetterwarnung für kritische Fenster

        {% if critical_new_problem_event %}
        Neu erkannt: {{ triggered_window_name }} – {% if trigger_to_state == 'on' %}geöffnet{% else %}Sensorstatus {{ trigger_to_state }}{% endif %}.
        {% endif %}
        Auslöser (ODER-Logik):
        {% for reason in critical_trigger_reasons %}• {{ reason }}
        {% endfor %}
        {% if probability_available %}Max. Regenwahrscheinlichkeit in {{ forecast_hours }} h: {{ max_probability }} %.{% endif %}
        {% if precipitation_available %}Max. Niederschlag pro Forecast-Stunde in {{ forecast_hours }} h: {{ max_precipitation }} {{ precipitation_unit }}.{% endif %}

        {% if critical_open | length > 0 %}
        Sofort schließen:
        {% for item in critical_open %}• {{ item }}
        {% endfor %}
        {% endif %}
        {% if critical_unknown | length > 0 %}
        ⚠️ Status kritischer Sensoren nicht verfügbar:
        {% for item in critical_unknown %}• {{ item }}
        {% endfor %}
        {% endif %}
        {% if critical_stale | length > 0 %}
        ⚠️ Last-seen-Zeitstempel kritischer Sensoren zu alt/nicht verfügbar:
        {% for item in critical_stale %}• {{ item }}
        {% endfor %}
        {% endif %}

        {% if recommend_regular_with_critical and (regular_open | length > 0) and not regular_alert %}
        Empfohlen zu schließen:
        {% for item in regular_open %}• {{ item }}
        {% endfor %}
        Die Warnstufe für reguläre Fenster ist derzeit noch nicht aktiv.
        {% endif %}
        {% if (regular_unknown | length > 0) and not regular_alert %}
        Hinweis – Status regulärer Sensoren unbekannt/unavailable: {{ regular_unknown | join(', ') }}.
        {% endif %}
        {% if (regular_stale | length > 0) and not regular_alert %}
        Hinweis – Last-seen-Zeitstempel regulärer Sensoren zu alt/nicht verfügbar: {{ regular_stale | join(', ') }}.
        {% endif %}

      regular_message: >-
        🌧️ Warnstufe für reguläre Fenster erreicht

        {% if regular_new_problem_event %}
        Neu erkannt: {{ triggered_window_name }} – {% if trigger_to_state == 'on' %}geöffnet{% else %}Sensorstatus {{ trigger_to_state }}{% endif %}.
        {% endif %}
        Auslöser (ODER-Logik):
        {% for reason in regular_trigger_reasons %}• {{ reason }}
        {% endfor %}
        {% if probability_available %}Max. Regenwahrscheinlichkeit in {{ forecast_hours }} h: {{ max_probability }} %.{% endif %}
        {% if precipitation_available %}Max. Niederschlag pro Forecast-Stunde in {{ forecast_hours }} h: {{ max_precipitation }} {{ precipitation_unit }}.{% endif %}

        {% if regular_open | length > 0 %}
        Bitte schließen:
        {% for item in regular_open %}• {{ item }}
        {% endfor %}
        {% endif %}
        {% if regular_unknown | length > 0 %}
        ⚠️ Status nicht verfügbar: {{ regular_unknown | join(', ') }}.
        {% endif %}
        {% if regular_stale | length > 0 %}
        ⚠️ Last-seen-Zeitstempel zu alt/nicht verfügbar: {{ regular_stale | join(', ') }}.
        {% endif %}

      recommendation_message: >-
        🌦️ Vorsorgliche Empfehlung

        {% if regular_new_problem_event and trigger_to_state == 'on' %}
        Neu geöffnet: {{ triggered_window_name }}.
        {% endif %}
        {% if regular_recommendation_due_to_critical %}
        Die kritische Wetterstufe ist bereits aktiv. Die Warnstufe für reguläre Fenster
        ist noch nicht aktiv; vorsorgliches Schließen wird empfohlen.
        Kritische Auslöser: {{ critical_trigger_reasons | join('; ') }}.
        {% else %}
        {% set metric_name = 'Regenwahrscheinlichkeit' if regular_threshold_type == 'probability' else 'Niederschlagsmenge' %}
        {% set unit = '%' if regular_threshold_type == 'probability' else precipitation_unit %}
        {{ metric_name }}: max. {{ regular_metric_value }} {{ unit }}.
        Die primäre Warnschwelle liegt bei {{ regular_threshold }} {{ unit }}; die Vorwarnung beginnt bei {{ regular_prewarning_threshold | round(2) }} {{ unit }}.
        {% endif %}

        Offen – vorsorglich schließen empfohlen:
        {% for item in regular_open %}• {{ item }}
        {% endfor %}

      data_problem_message: >-
        Wetterdaten für die Fensterprüfung sind unvollständig.
        Im Vorwarnzeitraum wurden Forecast-Einträge gefunden, aber der Wetteranbieter
        liefert den für die primäre Schwelle benötigten Wert nicht. Der fehlende Wert
        wird ausdrücklich nicht als 0 interpretiert.
        {% if critical_data_problem %}
        Kritische Fenster: Für die gewählte Schwellenart "{{ critical_threshold_type }}" fehlt der Wert.
        Betroffen/offen/unklar: {{ (critical_open + critical_unknown + critical_stale) | join(', ') }}.
        {% endif %}
        {% if regular_data_problem %}
        Reguläre Fenster: Für die gewählte Schwellenart "{{ regular_threshold_type }}" fehlt der Wert.
        Betroffen/offen/unklar: {{ (regular_open + regular_unknown + regular_stale) | join(', ') }}.
        {% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ critical_should_notify }}"
        sequence: !input critical_actions

  - if:
      - condition: template
        value_template: "{{ critical_should_notify and (mobile_notify_entities | length > 0) }}"
    then:
      - action: notify.send_message
        target:
          entity_id: !input mobile_notify_entities
        data:
          title: "{{ critical_title }}"
          message: "{{ critical_message }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ regular_should_notify }}"
        sequence: !input regular_actions

  - if:
      - condition: template
        value_template: "{{ regular_should_notify and (mobile_notify_entities | length > 0) }}"
    then:
      - action: notify.send_message
        target:
          entity_id: !input mobile_notify_entities
        data:
          title: "{{ regular_title }}"
          message: "{{ regular_message }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ regular_recommendation_should_notify }}"
        sequence: !input recommendation_actions

  - if:
      - condition: template
        value_template: "{{ regular_recommendation_should_notify and (mobile_notify_entities | length > 0) }}"
    then:
      - action: notify.send_message
        target:
          entity_id: !input mobile_notify_entities
        data:
          title: "{{ recommendation_title }}"
          message: "{{ recommendation_message }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ critical_data_problem_should_notify or regular_data_problem_should_notify }}
        sequence: !input data_problem_actions

  - if:
      - condition: template
        value_template: >-
          {{ (critical_data_problem_should_notify or regular_data_problem_should_notify)
             and (mobile_notify_entities | length > 0) }}
    then:
      - action: notify.send_message
        target:
          entity_id: !input mobile_notify_entities
        data:
          title: "{{ data_problem_title }}"
          message: "{{ data_problem_message }}"

  - variables:
      critical_notified_now: >-
        {{ critical_should_notify or critical_data_problem_should_notify }}
      regular_notified_now: >-
        {{ regular_should_notify
           or regular_recommendation_should_notify
           or regular_data_problem_should_notify }}

  # Warnstatus speichern. Dadurch ist eine spätere Entwarnung unabhängig vom Timer möglich.
  - if:
      - condition: template
        value_template: >-
          {{ critical_notified_now and (critical_alert_state_helper | string | length > 0) }}
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ critical_alert_state_helper }}"

  - if:
      - condition: template
        value_template: >-
          {{ regular_notified_now and (regular_alert_state_helper | string | length > 0) }}
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ regular_alert_state_helper }}"

  # Getrennte Timer-Cooldowns. Neue Probleme dürfen diese über die Logik oben umgehen.
  - if:
      - condition: template
        value_template: >-
          {{ critical_notified_now
             and (critical_cooldown_minutes | int(0) > 0)
             and (critical_cooldown_timer | string | length > 0) }}
    then:
      - action: timer.start
        target:
          entity_id: "{{ critical_cooldown_timer }}"
        data:
          duration: "{{ (critical_cooldown_minutes | int(0)) * 60 }}"

  - if:
      - condition: template
        value_template: >-
          {{ regular_notified_now
             and (regular_cooldown_minutes | int(0) > 0)
             and (regular_cooldown_timer | string | length > 0) }}
    then:
      - action: timer.start
        target:
          entity_id: "{{ regular_cooldown_timer }}"
        data:
          duration: "{{ (regular_cooldown_minutes | int(0)) * 60 }}"

mode: parallel
max: 10
max_exceeded: silent
